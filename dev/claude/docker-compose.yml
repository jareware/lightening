# Stable project name so container/network/volume names don't depend on the
# directory this is invoked from. Run from dev/claude/: `docker compose up -d --build`.
name: lightening-dev

# NOTHING from the host filesystem is mounted here, and no host environment is
# passed through. That is the entire security model, so it is worth stating what
# is deliberately absent:
#
#   - no ~/.ssh, ~/.aws, ~/.config/gh or ~/.gitconfig
#   - no bind mount of the repository (it is cloned inside the container)
#   - no GitHub credential of any kind (publishing is bin/push, on the host)
#   - no `env_file` pointing outside this directory
#
# `${VAR}` below interpolates from dev/claude/.env at parse time; that does NOT
# put VAR inside the container. Only keys listed under `environment:` get in.
# Adding a convenience mount here undoes the isolation -- don't.

services:
  # Owns the network namespace, and firewalls it. The dev container joins this
  # namespace rather than the other way round, so recreating the dev container
  # -- a rebuild, a changed Dockerfile -- rejoins a namespace that still has the
  # rules in it. With the ownership the other way, every rebuild silently
  # produced a fresh, empty, default-ACCEPT namespace.
  #
  # Consequence: a container joining a namespace may not declare `ports` or
  # `extra_hosts` (Docker rejects both), so they live here. /etc/hosts is
  # bind-mounted into the joiner, so extra_hosts still reaches the dev container.
  net:
    build: ./images/firewall
    init: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      HA_HOST_IP: ${HA_HOST_IP:?set in dev/claude/.env}
      HA_PORT: ${HA_PORT:-8123}
      # allowlist (default) or any -- see images/firewall/firewall.sh. Changing
      # this recreates net, which strands the dev container until bin/claude
      # repairs it.
      EGRESS: ${EGRESS:-allowlist}
    ports:
      # 127.0.0.1 only: the Vite dev server is for this machine's browser, not
      # the LAN. Keep the mapping 1:1 or Vite's HMR socket needs clientPort set.
      - "127.0.0.1:5173:5173"
    extra_hosts:
      # So HA_TARGET's hostname resolves in the dev container.
      - "${HA_HOSTNAME:?set in dev/claude/.env}:${HA_HOST_IP:?set in dev/claude/.env}"

  claude:
    build: ./images/claude
    # Joins net's namespace. This container has no NET_ADMIN, so it cannot alter
    # the rules governing it.
    network_mode: "service:net"
    depends_on:
      - net
    # Keepalive as the main process, so the container outlives any one session.
    entrypoint: ["tail", "-f", "/dev/null"]
    init: true # forward SIGTERM to tail so the container stops instantly
    environment:
      # From `claude setup-token` on an already-signed-in machine. This token is
      # readable by the agent from its own environment -- unavoidable, since it
      # has to authenticate. Scope and rotate accordingly.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?run `claude setup-token` and set it in dev/claude/.env}
      # Commit identity for work done in here; git reads these directly.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:?set in dev/claude/.env}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?set in dev/claude/.env}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL}
      # Read by frontend/vite.config.ts. A hostname, resolved via net's
      # extra_hosts -- the IP itself is not passed into this container.
      HA_TARGET: ${HA_TARGET:?set in dev/claude/.env}
    volumes:
      # The whole home directory, so the working copy, Claude Code and its
      # history, and the shell's state all survive the container being recreated.
      - home:/home/dev

volumes:
  home:
