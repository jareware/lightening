name: Release

on:
  push:
    branches: [master]

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Update version in source files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' custom_components/lightening/manifest.json > tmp && mv tmp custom_components/lightening/manifest.json
          sed -i "s/VERSION = .*/VERSION = \"$VERSION\"/" custom_components/lightening/const.py

      - name: Commit and tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
